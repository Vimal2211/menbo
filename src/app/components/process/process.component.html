<section id="process">
  <div class="section-inner">
    <div class="label">How We Work</div>
    <h2 class="section-title">Our Process</h2>
    <p class="section-sub">A transparent, collaborative approach from first call to final launch.</p>
    <div class="process-list reveal">
      <div class="process-item" *ngFor="let proc of processes">
        <div class="process-num">{{ proc.num }}</div>
        <div>
          <h3 class="process-title">{{ proc.title }}</h3>
          <p class="process-desc">{{ proc.description }}</p>
        </div>
        <div class="process-icon">
          <ng-container [ngSwitch]="proc.icon">
            <svg *ngSwitchCase="'discovery'" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <path d="M12 3v3M12 18v3M3 12H0M21 12h3M5 5l-2-2M21 21l-2-2M19 5l2-2M3 21l2-2"/>
            </svg>
            <svg *ngSwitchCase="'design'" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="8" cy="16" r="3"/>
              <circle cx="16" cy="8" r="3"/>
              <circle cx="16" cy="16" r="3"/>
              <path d="M8 13v3M11 16h3M16 5v3M16 11v3M16 17v3"/>
            </svg>
            <svg *ngSwitchCase="'development'" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <path d="M9 9l-3 3 3 3M15 9l3 3-3 3M12 3v18"/>
            </svg>
            <svg *ngSwitchCase="'testing'" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2L2 7v5c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5Z"/>
              <path d="m9 12 2 2 4-4"/>
            </svg>
            <svg *ngSwitchCase="'launch'" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2L7 8l5 2 5-2-5-6Z"/>
              <path d="M12 10l-4 10h8l-4-10M12 10v5"/>
              <path d="M8 20h8M7 22h10"/>
            </svg>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</section>
