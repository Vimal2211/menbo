<section id="services">
  <div class="section-inner">
    <div class="services-header">
      <div>
        <div class="label">What We Do</div>
        <h2 class="section-title">Our Services</h2>
      </div>
      <p class="section-sub" style="margin: 0">End-to-end digital services crafted to elevate your brand and accelerate your business.</p>
    </div>
    <div class="services-grid">
      <div class="service-card reveal" *ngFor="let service of services; let i = index" 
           [ngClass]="'rd' + (i > 0 ? i : '')"
           (click)="openServiceModal(service.id)">
        <div class="svc-top">
          <div class="svc-icon">
            <ng-container [ngSwitch]="service.icon">
              <svg *ngSwitchCase="'web'" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/>
                <path d="M3 12h18"/>
                <path d="M12 3a15 15 0 0 1 4 9 15 15 0 0 1-4 9 15 15 0 0 1-4-9 15 15 0 0 1 4-9Z"/>
              </svg>
              <svg *ngSwitchCase="'mobile'" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/>
                <path d="M10 6h4"/>
                <path d="M12 18h.01"/>
              </svg>
              <svg *ngSwitchCase="'design'" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/>
                <path d="M8 8h8"/>
                <path d="M8 12h5"/>
                <path d="M8 16h6"/>
                <path d="M14.5 8.5 16 7l1 1-1.5 1.5"/>
              </svg>
              <svg *ngSwitchCase="'marketing'" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/>
                <path d="M8 16V9"/>
                <path d="M12 16v-5"/>
                <path d="M16 16v-7"/>
                <path d="M8 16h8"/>
              </svg>
              <svg *ngSwitchCase="'seo'" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"/>
                <path d="m21 21-4.35-4.35"/>
              </svg>
              <svg *ngSwitchCase="'consulting'" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3 4 7v5c0 5 3.5 8.5 8 9 4.5-.5 8-4 8-9V7l-8-4Z"/>
                <path d="M9 12 11 14l4-4"/>
              </svg>
            </ng-container>
          </div>
          <span class="svc-num">{{ service.num }}</span>
        </div>
        <h3 class="svc-title">{{ service.title }}</h3>
        <p class="svc-desc">{{ service.description }}</p>
        <div class="svc-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="presentation">
            <path d="M5 12h14" />
            <path d="m15 7 5 5-5 5" />
          </svg>
        </div>
      </div>
    </div>
  </div>
</section>
